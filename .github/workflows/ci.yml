name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -count=1 ./...
      - name: The five samples render, and order-service draws the figure of the README
        run: |
          for model in testdata/samples/*/model.json; do
            dir=$(dirname "$model")
            out="$RUNNER_TEMP/samples/$(basename "$dir")"
            go run ./cmd/ponchimap render --model "$dir/model.json" --view "$dir/view.yaml" \
              --output "$out" --report "$out/report.md"
          done
          cmp "$RUNNER_TEMP/samples/order-service/overview.png" docs/images/order-service.png
      - name: Build the command for the first run
        run: go build -o "$RUNNER_TEMP/ponchimap" ./cmd/ponchimap
      # A new network namespace has only a loopback interface, and it is down.
      # The step first shows that nothing is reachable from there.
      - name: The first run of the README works with no network
        run: |
          sudo unshare --net -- sudo -u "$USER" env "PATH=$PATH" sh -c '
            if curl -sS -m 5 -o /dev/null https://github.com; then
              echo "the network is reachable, so this step would prove nothing" >&2
              exit 1
            fi
            scripts/first-run.sh "$1"
          ' sh "$RUNNER_TEMP/ponchimap"
