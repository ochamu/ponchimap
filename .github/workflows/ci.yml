name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check Go formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -count=1 ./...
      - name: Build the command
        run: go build -o "$RUNNER_TEMP/ponchimap" ./cmd/ponchimap
      - name: Render all samples and compare the published figures
        run: |
          samples=(testdata/samples/*/)
          test "${#samples[@]}" -ge 5
          for dir in "${samples[@]}"; do
            out="$RUNNER_TEMP/samples/$(basename "$dir")"
            "$RUNNER_TEMP/ponchimap" render --model "${dir}model.json" --view "${dir}view.yaml" \
              --output "$out" --report "$out/report.md"
            test -s "$out/overview.png"
          done
          cmp "$RUNNER_TEMP/samples/order-service/overview.png" docs/images/order-service.png
          cmp "$RUNNER_TEMP/samples/long-labels-and-mismatches/overview.png" docs/images/long-labels-and-mismatches.png
      # A new network namespace has only a loopback interface, and it is down.
      # The step first shows that nothing is reachable from there.
      - name: The first run of the README works with no network
        run: |
          sudo unshare --net -- sudo -u "$USER" env "PATH=$PATH" sh -c '
            if curl -sS -m 5 -o /dev/null https://github.com; then
              echo "the network is reachable, so this step would prove nothing" >&2
              exit 1
            fi
            scripts/first-run.sh "$1"
          ' sh "$RUNNER_TEMP/ponchimap"

  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Preserve the line endings of test fixtures
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -count=1 ./...
      - name: Run the README example
        if: runner.os == 'macOS'
        run: scripts/first-run.sh
